substitutions:
  device_name: 00-gasmeter
  # this sensor is counting the pulses, if your gas meter says 1 imp = 0,01m3 then 0.01 below is right
  # you need to change it if the pulse to m3 ratio is different on your gas meter
  pulse_ratio: "0.01"
  # factor to convert m³ pulses into kWh; adjust to your local conversion factor
  kwh_factor: "0.1"
  # these values need to be adjusted based on your setup, this is the voltage the analog input is measuring
  analog_threshold_upper: "0.531"
  analog_threshold_lower: "0.53"

esphome:
  name: ${device_name}

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  password: !secret ota_gasmester

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
# this will count the pules, calculated by "analog threshold"sensor
  - id: total_pulses
    type: int
    restore_value: true
    initial_value: '0'

binary_sensor:


  - platform: analog_threshold
    name: "GasMeterAnalogTreshhold"
    sensor_id: gasmeteranaloginput
    threshold:
      upper: ${analog_threshold_upper}
      lower: ${analog_threshold_lower}
    on_press:
      then:
        - lambda: id(total_pulses) += 1;

sensor:
 # this sensor is counting the pulses, if your gas meter says 1 imp = 0,01m3 then the 0.001 below is right
 #you need to change it if the pulse to m3 ratio is different on your gas meter
  - platform: template
    name: "GasverbrauchAd"
    device_class: gas
    unit_of_measurement: "m³"
    state_class: "total_increasing"
    icon: "mdi:fire"
    accuracy_decimals: 2
    lambda: |-
      return id(total_pulses) * ${pulse_ratio};
      ESP_LOGD("Gaszähler analog TAG", "Pulse bisher: %d", id(total_pulses));

  # this sensor is using the same logic, just calculating in kWh
  - platform: template
    name: "Gasverbrauch-kWh"
    device_class: gas
    unit_of_measurement: "kWh"
    state_class: "total_increasing"
    icon: "mdi:fire"
    accuracy_decimals: 2
    lambda: |-
      return id(total_pulses) * ${kwh_factor};
      ESP_LOGD("Gaszähler kWh TAG", "Pulse bisher: %d", id(total_pulses));
  
  #analog input connected to the analog sensor output from the hall sensor board
  - platform: adc
    internal: TRUE
    pin: A0
    id: gasmeteranaloginput
    name: "GasMeterAnalogInput"
    update_interval: 2s
